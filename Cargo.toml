[workspace]
members = [
    "crates/lico-catalog-convergence",
    "crates/licoup-state-machine-codegen",
    "crates/licoup-foundation",
    "crates/licoup-agent-targets",
    "crates/licoup-model-catalog",
    "crates/licoup-client-state",
    "crates/licoup-agent-adapter-sdk",
    "crates/licoup-agent-drivers",
    "crates/licoup-agent-codex",
    "crates/licoup-agent-claude-code",
    "crates/licoup-agent-copilot",
    "crates/licoup-agent-pi",
    "crates/licoup-agent-antigravity",
    "crates/licoup-agent-cursor",
    "crates/licoup-agent-deepseek",
    "crates/licoup-agent-kimi",
    "crates/licoup-agent-hermes",
    "crates/licoup-agent-kilo",
    "crates/licoup-agent-lico-agent",
    "crates/licoup-agent-openclaw",
    "crates/licoup-agent-opencode",
    "crates/licoup-platform-bridges",
    "crates/licoup-agent-adapters",
    "crates/licoup-agent-runtime",
    "crates/licoup-project",
    "crates/licoup-application",
    "crates/licoup-collaboration",
    "crates/licoup-extension-contracts",
    "crates/licoup-workflow",
    "crates/licoup-workflow-runtime",
    "crates/licoup-workflow-store",
    "crates/licoup-private-gateway",
    "crates/licoup-conversation",
    "crates/licoup-public-gateway",
    "crates/licoup-public-gateway/entry",
    "crates/licoup",
    "crates/trybuild",
]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.95.0"
repository = "https://github.com/LicoLand/LicoUp-CLI.git"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Internal publishable crates, pinned to the workspace version.
lico-catalog-convergence = { path = "crates/lico-catalog-convergence", version = "=0.3.1" }
licoup = { path = "crates/licoup", version = "=0.3.1" }
licoup-agent-adapter-sdk = { path = "crates/licoup-agent-adapter-sdk", version = "=0.3.1" }
licoup-agent-adapters = { path = "crates/licoup-agent-adapters", version = "=0.3.1" }
licoup-agent-antigravity = { path = "crates/licoup-agent-antigravity", version = "=0.3.1" }
licoup-agent-claude-code = { path = "crates/licoup-agent-claude-code", version = "=0.3.1" }
licoup-agent-codex = { path = "crates/licoup-agent-codex", version = "=0.3.1" }
licoup-agent-copilot = { path = "crates/licoup-agent-copilot", version = "=0.3.1" }
licoup-agent-cursor = { path = "crates/licoup-agent-cursor", version = "=0.3.1" }
licoup-agent-deepseek = { path = "crates/licoup-agent-deepseek", version = "=0.3.1" }
licoup-agent-drivers = { path = "crates/licoup-agent-drivers", version = "=0.3.1" }
licoup-agent-hermes = { path = "crates/licoup-agent-hermes", version = "=0.3.1" }
licoup-agent-kilo = { path = "crates/licoup-agent-kilo", version = "=0.3.1" }
licoup-agent-kimi = { path = "crates/licoup-agent-kimi", version = "=0.3.1" }
licoup-agent-lico-agent = { path = "crates/licoup-agent-lico-agent", version = "=0.3.1" }
licoup-agent-openclaw = { path = "crates/licoup-agent-openclaw", version = "=0.3.1" }
licoup-agent-opencode = { path = "crates/licoup-agent-opencode", version = "=0.3.1" }
licoup-agent-pi = { path = "crates/licoup-agent-pi", version = "=0.3.1" }
licoup-agent-runtime = { path = "crates/licoup-agent-runtime", version = "=0.3.1" }
licoup-agent-targets = { path = "crates/licoup-agent-targets", version = "=0.3.1" }
licoup-application = { path = "crates/licoup-application", version = "=0.3.1" }
licoup-client-state = { path = "crates/licoup-client-state", version = "=0.3.1" }
licoup-conversation = { path = "crates/licoup-conversation", version = "=0.3.1" }
licoup-extension-contracts = { path = "crates/licoup-extension-contracts", version = "=0.3.1" }
licoup-foundation = { path = "crates/licoup-foundation", version = "=0.3.1" }
licoup-model-catalog = { path = "crates/licoup-model-catalog", version = "=0.3.1" }
licoup-platform-bridges = { path = "crates/licoup-platform-bridges", version = "=0.3.1" }
licoup-private-gateway = { path = "crates/licoup-private-gateway", version = "=0.3.1" }
licoup-project = { path = "crates/licoup-project", version = "=0.3.1" }
licoup-public-gateway = { path = "crates/licoup-public-gateway", version = "=0.3.1", default-features = false }
licoup-state-machine-codegen = { path = "crates/licoup-state-machine-codegen", version = "=0.3.1" }
licoup-workflow = { path = "crates/licoup-workflow", version = "=0.3.1" }
licoup-workflow-runtime = { path = "crates/licoup-workflow-runtime", version = "=0.3.1" }
licoup-workflow-store = { path = "crates/licoup-workflow-store", version = "=0.3.1" }
# One canonical version per shared dependency. Members reference these via
# `workspace = true`; keep direct-dependency generations in one place.
#
# First-party crates published by crates.io owner `Unka-Malloc` from the
# Agent-Statistics, Adapter-For-All-Agents and Adapters-For-Model-Providers
# repositories. The owner record and the Cargo.lock checksum are the published
# artifact's provenance; an exact version keeps a registry substitution a
# reviewable manifest edit.
a4aa = "=0.5.1"
a4aa-copilot = "=0.5.0"
# The forwarding core lives in Fairliny: the private gateway composes the same
# sibling checkout fairliny-gateway binds, so adapter, wire and canonical types
# are one package instance — never two copies drifting apart across the seam.
a4mp = { version = "=0.4.0", default-features = false }
# The messenger-channel contract and the Telegram dialect live in A4MC: the
# public gateway composes the same sibling checkout, so contract, dialect and
# product binding stay one package instance across the seam.
a4mc = "=0.1.0"
a4mc-telegram = "=0.1.0"
acop = "=0.2.0"
acop-antigravity = "=0.2.0"
acop-claude = "=0.2.0"
acop-codex = "=0.2.0"
acop-copilot = "=0.2.0"
acop-cursor = "=0.2.0"
acop-dsh = "=0.2.0"
acop-hermes = "=0.2.0"
acop-kilo-code = "=0.2.0"
acop-kimi-code = "=0.2.0"
acop-openclaw = "=0.2.0"
acop-opencode = "=0.2.0"
acop-pi = "=0.2.0"
acop-usage-source = "=0.1.0"
credential-lease = "=0.3.0"
credential-lease-keychain = "=0.1.0"
fairliny-gateway = "=0.1.0"
metera-sdk = "=0.1.0"
agent-statistics = "=0.3.0"
balance-detector = "=0.2.0"
collection-store = "=0.1.1"
token-usage-detector = "=0.2.2"
anyhow = "1.0"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
command-group = "5.0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
env_logger = "0.11"
flate2 = "1.0"
fs2 = "0.4"
hkdf = "0.12"
icu_segmenter = { version = "2", features = ["compiled_data", "lstm"] }
interprocess = "2.4"
libc = "0.2"
# The LicoArc endpoint client, published by crates.io owner `Unka-Malloc` from
# the LicoArc-Client repository.
licoarc-client = "=0.2.0"
log = "0.4"
mime_guess = "2.0"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1.11"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tar = "0.4"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"
trash = "5.2"
ureq = { version = "2.10", features = ["json"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
# The DeepSeek Harness records a session as a concatenated Zstandard container,
# one independently decodable frame per durable batch. The DeepSeek adapter
# package reads that artifact natively, so the decoder is a real dependency of
# the package rather than of the kernel.
zstd = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
