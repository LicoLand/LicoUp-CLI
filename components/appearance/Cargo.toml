[workspace]

[package]
name = "licoup-appearance"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "AGPL-3.0-or-later"
publish = false
description = "Appearance resource converter (org.licoland.converter.appearance): the native owner of the appearance slice of the persisted client-state format, declared through the package conversion contract."

[[bin]]
name = "licoup-appearance-convert"
path = "src/main.rs"

[dependencies]
# The client's own migration owner. This package declares the conversion and runs that
# owner over one data root; it keeps no conversion algorithm and no second writer.
licoup = { path = "../../crates/licoup" }
# The published package conversion contract this package declares itself through.
licoup-extension-contracts = { path = "../../crates/licoup-extension-contracts" }
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The private-state writers the suites seed a synthetic root with, so a fixture is
# written the way the client's own owner writes one.
licoup-foundation = { path = "../../crates/licoup-foundation" }
