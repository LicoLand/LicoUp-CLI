[package]
name = "licoup-foundation"
version = "0.3.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared LicoUp foundations: bounded private file I/O, portable data-home paths, secret bytes, safe archive expansion and process supervision."

[features]
# Test-only zeroize observation probes consumed by the custody test suites.
test-support = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
command-group.workspace = true
fs2.workspace = true
flate2.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
url.workspace = true
uuid.workspace = true
zip.workspace = true
zeroize.workspace = true



[target.'cfg(unix)'.dependencies]
# The bounded process supervisor reaps children by process group and reports
# exit status, which needs the platform wait and signal definitions.
libc.workspace = true
nix = { version = "0.27", default-features = false, features = ["fs", "user"] }
