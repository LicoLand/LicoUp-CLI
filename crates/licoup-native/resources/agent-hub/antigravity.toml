id = "antigravity"
binary_names = ["agy", "antigravity"]
official_docs = "https://antigravity.google/docs/cli-install"

[[channels]]
id = "homebrew"
kind = "homebrew"
oses = ["macos"]
architectures = ["aarch64", "x86_64"]
priority = 10
official_recommended = true
licoup_verified = true
requires_manager = "homebrew"
elevation = "none"
scope = "user"
package_coordinate = "antigravity-cli"
package_form = "cask"
official_source = "https://formulae.brew.sh/cask/antigravity-cli"
version_policy = "latest-stable"
install_argv = ["brew", "install", "--cask", "antigravity-cli"]
update_argv = ["brew", "upgrade", "--cask", "antigravity-cli"]
uninstall_argv = ["brew", "uninstall", "--cask", "antigravity-cli"]
verify_argv = ["agy", "--version"]

[[channels]]
id = "npm"
kind = "npm"
oses = ["macos", "linux", "windows"]
architectures = ["aarch64", "x86_64"]
priority = 20
official_recommended = false
licoup_verified = false
requires_manager = "npm"
elevation = "none"
scope = "user"
selectable = false
unsupported_reason = "no-official-package-coordinate"
package_coordinate = "antigravity"
official_source = "https://antigravity.google/docs/cli-install"
version_policy = "latest-stable"

[[channels]]
id = "winget"
kind = "winget"
oses = ["windows"]
architectures = ["aarch64", "x86_64"]
priority = 20
official_recommended = false
licoup_verified = false
requires_manager = "winget"
elevation = "none"
scope = "user"
selectable = false
unsupported_reason = "no-official-package-coordinate"
package_coordinate = "antigravity"
official_source = "https://antigravity.google/docs/cli-install"
version_policy = "latest-stable"

[[channels]]
id = "official-artifact"
kind = "official-artifact"
oses = ["macos", "linux", "windows"]
architectures = ["aarch64", "x86_64"]
priority = 30
official_recommended = true
licoup_verified = true
requires_manager = "none"
elevation = "none"
scope = "user"
package_coordinate = "agy-installer"
official_source = "https://antigravity.google"
version_policy = "vendor-latest"
install_argv = ["bash", "{script}"]
windows_install_argv = ["powershell", "-NoProfile", "-File", "{script}"]
update_argv = ["agy", "update"]
uninstall_argv = ["rm", "{install}"]
verify_argv = ["{install}", "--version"]

[channels.artifact]
origin_host = "antigravity.google"
url_template = "https://antigravity.google/cli/{installer}"
[channels.artifact.installer]
macos = "install.sh"
linux = "install.sh"
windows = "install.ps1"

# Where this channel's installer lands its executable. The vendor's own
# installer performs the placement. Uninstall removes the declared path and
# verify runs it, so neither depends on a name PATH happens to answer.
[channels.install]
[channels.install.binary]
macos = "agy"
linux = "agy"
[channels.install.dir]
macos = "{home}/.local/bin"
linux = "{home}/.local/bin"
