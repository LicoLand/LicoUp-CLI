schema_version = "v0.0.2:client-agent-hub-manifest-1"
host_scope = "desktop"
plugin_management_boundary = "adapter-plugins-only"
adaptation_tags = ["deep", "partial", "pending-evaluation"]
channel_kinds = ["homebrew", "npm", "winget", "official-artifact"]

[[agents]]
id = "codex"
label = "Codex CLI"
adaptation = "deep"
protocol = "codex-app-server-stdio-jsonrpc"
license = "Apache-2.0"
summary = "Codex CLI is a coding agent from OpenAI that runs locally on your computer."
homepage = "https://developers.openai.com/codex"
requires_login = true
connection_modes = ["local"]
file = "codex.toml"

[[agents]]
id = "cursor"
label = "Cursor CLI"
adaptation = "deep"
protocol = "cursor-agent-cli-v1"
license = "proprietary"
summary = "Cursor is a coding agent for building ambitious software. Use it to understand your codebase, plan and build features, fix bugs, review changes, and work with the tools you already use."
homepage = "https://cursor.com"
requires_login = true
connection_modes = ["local"]
file = "cursor.toml"

