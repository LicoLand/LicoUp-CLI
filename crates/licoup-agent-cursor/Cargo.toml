[package]
name = "licoup-agent-cursor"
version = "0.14.0"
edition = "2024"
rust-version = "1.95.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LicoLand/LicoUp-CLI.git"
description = "Cursor adapter package: the Cursor Agent CLI turn dialect and its wire vocabulary"

# The crate is one package's program. `parser` is this Agent's vendor protocol
# below the adapter port: the strict-lf-ndjson turn dialect of the Cursor Agent
# CLI, classified exactly once, per ADR-0008. `model` and `errors` are the wire
# vocabulary that dialect reads and reports — the launch arguments, the
# capability surface, the effective settings and the closed failure vocabulary.
# `driver` is the process half that runs one turn, `port` is the seams the host
# answers, `registration` is what composition injects into
# `licoup-agent-adapter-sdk`, and `replay` is the arm that drives the same parser
# from a recorded transcript.
#
# The kernel links no part of this crate's protocol. Composition names the crate
# for its registration and for the driver it runs, while the extension host's
# binary route is completed by the agent-execution port; nothing here reaches
# back into a client crate.
[features]
default = []

[dependencies]
licoup-agent-adapter-sdk = { path = "../licoup-agent-adapter-sdk" }
# The Subagent MCP mesh's own caller-context binding. A delegated Cursor turn
# binds the caller its client was registered with, and the mesh owns that
# binding, so the package calls it rather than keeping a second copy of the
# caller vocabulary.
licoup-agent-drivers = { path = "../licoup-agent-drivers" }
# The user login-shell environment snapshot every Agent CLI launch is cleared to
# (ADR 0007). The snapshot belongs to the Agent declarations that observe it, so
# the package reads the same single capture the host's other drivers do.
licoup-agent-targets = { path = "../licoup-agent-targets" }
# The bounded process owner, the raw-execution observer, the bounded-workspace
# resolution and the turn-event bus every Agent CLI lane is built from. They are
# the host's own machinery below every Agent, so the package reaches the one
# implementation instead of keeping a second one.
licoup-foundation = { path = "../licoup-foundation" }
serde_json.workspace = true
# Retiring a native Cursor chat moves it to the system trash rather than
# unlinking it, because the same local storage is the user's own chat history.
trash.workspace = true

[target.'cfg(unix)'.dependencies]
# The `SIGTERM` one cancelled turn is classified by: a turn stopped through the
# process group is reported as cancelled, and that classification reads the
# signal the root exited with.
libc.workspace = true
# The process-group signal a cancelled Cursor turn is stopped with. The turn
# runs as its own process group, so the package signals the whole group.
nix = { version = "0.27", default-features = false, features = ["signal"] }

[[bin]]
name = "lico-agent-cursor"
path = "src/bin/lico-agent-cursor.rs"

# Test-only. The committed package artifact is validated with the host's own
# manifest, permission and client-compatibility contract instead of a second
# reading of it. Nothing here enters the package binary, which links no kernel
# crate and reads its own package documents as data.
[dev-dependencies]
licoup-extension-contracts = { path = "../licoup-extension-contracts" }
# The driver's own suite steers its fake Cursor CLI through the inherited
# environment, which the production snapshot deliberately replaces, so the
# snapshot's test-only pin is on for this crate's tests.
licoup-agent-targets = { path = "../licoup-agent-targets", features = ["test-support"] }
