[package]
name = "licoup-agent-openclaw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenClaw adapter package: the Gateway ACP driver vocabulary and its vendor protocol"

# The crate is one package's program. `parser` is this Agent's vendor protocol
# below the adapter port: the Gateway ACP state machine, the byte-line codec that
# classifies one frame exactly once per ADR-0008, and the allowlisted update
# projection. `gateway_acp` is the driver vocabulary those frames are reported
# through — the run and failure vocabulary, the request validation and the
# session continuity binding. `gateway` and `policy` are the endpoint the ACP
# attach names and the endpoint policy behind it. `driver` is the process half:
# the bounded capability probe, the Gateway attach, the supervised bridge and the
# turn it runs. `port` is the seam the host answers, `registration` is what
# composition injects into `licoup-agent-adapter-sdk`, and `replay` is the arm
# that drives the same state machine from a recorded transcript.
#
# The kernel links no part of this crate's protocol. Composition names the crate
# for its registration and for its driver while the extension host's binary route
# is completed by the agent-execution port; nothing here reaches back into a
# client crate.
[features]
default = []

[dependencies]
licoup-agent-adapter-sdk.workspace = true
# The neutral ACP runtime: the active-turn control plane this package's driver
# registers a running turn in and cancels through, so force stop reaches an
# OpenClaw session through the same registry as every other ACP Agent. The
# package owns the identity it pools its sessions by; the engine owns the
# registry.
licoup-agent-drivers.workspace = true
# The shared ACP wire vocabulary a Gateway ACP frame is validated against, the
# one predicate that decides whether an ACP working directory is absolute, the
# user login-shell environment the bridge is launched in, and the SSH target it
# is launched through. All are shared facts this package and the client read from
# the same owner rather than client facts this package asks for, so they are
# dependencies rather than ports — exactly as `licoup-agent-drivers` reads them.
licoup-agent-targets.workspace = true
# The bounded process supervisor and the raw-execution diagnostic record: the
# same primitives the client's own drivers launch children with, so the package
# cannot keep a second process implementation of its own.
licoup-foundation.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[[bin]]
name = "lico-agent-openclaw"
path = "src/bin/lico-agent-openclaw.rs"

# Test-only. The committed package artifact is validated with the host's own
# manifest, permission and client-compatibility contract instead of a second
# reading of it. Nothing here enters the package binary, which links no kernel
# crate and reads its own package documents as data.
[dev-dependencies]
licoup-extension-contracts.workspace = true
