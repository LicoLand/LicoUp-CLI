[package]
name = "licoup-private-gateway"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LicoUp Private Gateway: the authenticated loopback LLM model gateway — compiled model router, credential leases, private control channels and the runtime that serves them."

[dependencies]
a4mp.workspace = true
anyhow.workspace = true
async-trait = "0.1"
base64.workspace = true
bytes = "1"
# The outward forwarding core: fairliny's Router binds a4mp adapters over this
# host's transport and lease ports. The crate keeps the host shell — loopback
# listeners, wire dialects, client-token auth, custody and the usage journal.
fairliny-gateway = { workspace = true }
fs2.workspace = true
futures = "0.3"
http = "1"
licoup-foundation = { path = "../licoup-foundation", version = "0.3.0" }
credential-lease = { workspace = true }
agent-statistics.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Test-only. The committed package artifact is read with the host's own manifest
# contract instead of a second reading of it: `package_declaration.rs` parses
# `package/manifest.json` through `PackageManifest`, so the declaration this
# package ships is admitted by the same reader the installer uses. Nothing here
# enters the runtime.
[dev-dependencies]
licoup-extension-contracts = { path = "../licoup-extension-contracts" }
