[package]
name = "licoup-private-gateway"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LicoUp Private Gateway: the authenticated loopback LLM model gateway — compiled model router, credential leases, private control channels and the runtime that serves them."

[dependencies]
anyhow.workspace = true
base64.workspace = true
fs2.workspace = true
licoup-foundation = { path = "../licoup-foundation", version = "0.3.0" }
credential-lease = { version = "0.2.0" }
licoup-statistics = { path = "../licoup-statistics", version = "0.1.0" }
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Test-only. The committed package artifact is read with the host's own manifest
# contract instead of a second reading of it: `package_declaration.rs` parses
# `package/manifest.json` through `PackageManifest`, so the declaration this
# package ships is admitted by the same reader the installer uses. Nothing here
# enters the runtime.
[dev-dependencies]
licoup-extension-contracts = { path = "../licoup-extension-contracts" }
