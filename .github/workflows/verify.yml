name: Verify

on:
  pull_request:
  push:
    branches: ["nightly", "stable", "release"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Fetch the canonical LicoArc authority bundle
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/LicoLand/LicoArc/e33b151a6d9870b73857f68d333f15010584cc2c/artifacts/v1/licoarc.bundle.json" -o "$RUNNER_TEMP/licoarc.bundle.json"
          actual="$(shasum -a 256 "$RUNNER_TEMP/licoarc.bundle.json" | cut -d' ' -f1)"
          test "$actual" = "e47aa234dee48ca3f791c733b2514c93f1e912bce8f5754813879c6b197d6814"
          echo "LICOARC_AUTHORITY_BUNDLE=$RUNNER_TEMP/licoarc.bundle.json" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features licoup/test-support -- -D warnings -A clippy::style -A clippy::complexity
      - name: Tests
        run: node tools/scripts/cargo-client.mjs test --workspace --locked --no-fail-fast --features licoup/test-support
      - name: Package the tagged crate
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo package --locked -p licoup

  node:
    name: Node contract tests
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Contract tests
        run: node --test 'tests/contract/**/*.test.mjs' tools/scripts/lib/test-artifact-lifecycle.test.mjs

  release-build:
    name: Release build ${{ matrix.target }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    uses: ./.github/workflows/cli-release-build.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
    permissions:
      contents: read

  dispatch-publish:
    needs: [rust, node]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Request publication from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERIFY_RUN: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg ref "$DEFAULT_BRANCH" --arg tag "$TAG" --arg run "$VERIFY_RUN" \
            '{ref: $ref, inputs: {tag: $tag, verify_run: $run}}')"
          curl --fail --silent --show-error --output /dev/null \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/dispatches"
